name: e2e (Cypress)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

jobs:
  cypress:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (inkl. Cypress-Binary)
        run: npm ci

      - name: Build widget (tsc + vite)
        run: npm run build

      - name: Start vite preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4173/ > /dev/null

      # Default: Agent-API wird in den Specs per cy.intercept gemockt, kein Magento noetig.
      # Fuer einen Live-Lauf gegen Agent+Magento stattdessen E2E_MOCK_API=false setzen
      # und zusaetzlich einen Job mit `make demo` einrichten.
      - name: Run Cypress e2e suite
        run: npx cypress run --browser electron

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore
